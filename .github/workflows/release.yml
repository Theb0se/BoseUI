name: Release Registry Bundle

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Registry Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync, Validate & Build
        run: |
          npm run sync
          npm run typecheck
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package Shadcn v2 Registry Archive
        run: |
          tar -czf boseui-registry.tar.gz public/r public/registry.json public/llms.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            boseui-registry.tar.gz
            public/registry.json
            public/llms.txt
